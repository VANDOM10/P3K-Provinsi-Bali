function trend(d){const days=[];for(let i=13;i>=0;i--){const t=new Date();t.setDate(t.getDate()-i);days.push(ymd(t))}
 const v=days.map(x=>sum(d.filter(r=>r.tgl===x),"pasien")),mx=Math.max(1,...v),W=600,H=150,bw=W/14;
 return`<svg class="v" viewBox="0 0 ${W} ${H+22}">${v.map((n,i)=>`<rect x="${i*bw+5}" y="${H-n/mx*(H-18)}" width="${bw-10}" height="${n/mx*(H-18)}" rx="3" fill="var(--bl)"/><text x="${i*bw+bw/2}" y="${H-n/mx*(H-18)-3}" font-size="11" text-anchor="middle" fill="currentColor">${n||""}</text><text x="${i*bw+bw/2}" y="${H+14}" font-size="10" text-anchor="middle" fill="var(--mu)">${days[i].slice(8)}/${days[i].slice(5,7)}</text>`).join("")}</svg>`}

async function minta(){const w=S.w||PROV;if(w===PROV){S.ok=0;S.msg="Provinsi: gunakan kode pemulihan.";return render(true)}try{await api("minta",{w});S.ok=1;S.msg="Permintaan terkirim. Hubungi Provinsi Bali."}catch(e){S.ok=0;S.msg=e.message}render(true)}
async function pulih(){const k=$("#kp").value.trim(),n=$("#np").value;S.ok=0;if(Date.now()<S.lock){S.msg="Terkunci sementara.";return render(true)}if(!kuat(n)){S.msg="Password kurang kuat (min. 8, besar, kecil, angka, simbol).";return render(true)}try{await api("pulih",{k,n});S.lupa=false;S.ok=1;S.msg="Password Provinsi diganti. Silakan login."}catch(e){S.msg=e.message;if(e.status===429)S.lock=Date.now()+3e4}render(true)}
function vReset(){const rs=S.RS||[];return`<div class="card"><h2>Reset / Edit Password Kabupaten</h2><p class="mu">Kosongkan kolom untuk dibuatkan password acak. Password ini sementara: kabupaten wajib menggantinya saat login.</p><div class="tw"><table><tr><th>Wilayah</th><th>Permintaan</th><th>Password baru</th><th></th></tr>${KAB.map((k,i)=>{const q=rs.find(x=>x.id===k);return`<tr><td>${k}</td><td>${q?`<span class="b M">${new Date(q.ts).toLocaleString("id-ID")}</span>`:"-"}</td><td><input id="rp${i}" placeholder="otomatis" style="min-width:150px"></td><td><button onclick="setPw('${k}',${i})">Set</button></td></tr>`}).join("")}</table></div></div>`}
async function setPw(k,i){const n=$("#rp"+i).value;if(n&&!kuat(n))return fb("Password kurang kuat.");try{const j=await api("setpw",{k,n});await refresh(false,true,true);fb("Password sementara "+k+": "+j.pw+" (catat sekarang, tidak tampil lagi)",1)}catch(e){fb(e.message)}}

function area(v,lb){const W=600,H=170,B=H-20,mx=Math.max(1,...v),st=W/(v.length-1),P=v.map((n,i)=>[i*st,B-n/mx*(H-50)-4]);let dd="M"+P[0];for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],c=(a[0]+b[0])/2;dd+=`C${c},${a[1]} ${c},${b[1]} ${b[0]},${b[1]}`}return`<svg class="ar" viewBox="0 0 ${W} ${H+6}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12a58a" stop-opacity=".45"/><stop offset="1" stop-color="#12a58a" stop-opacity="0"/></linearGradient></defs><path class="af" d="${dd}L${W},${B}L0,${B}Z" fill="url(#ga)"/><path class="ln" d="${dd}" fill="none" stroke="#0b7a5f" stroke-width="3" stroke-linecap="round" pathLength="1"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--card)" stroke="#0b7a5f" stroke-width="2"/>${i%2?"":`<text x="${p[0]}" y="${H}" font-size="10" text-anchor="middle" fill="var(--mu)">${lb[i]}</text>`}`).join("")}</svg>`}
function vBeranda2(){const d=filt(),P=S.user===PROV,td=today(),hr=new Date().getHours(),g=hr<11?"Selamat pagi":hr<15?"Selamat siang":hr<18?"Selamat sore":"Selamat malam",wait=d.filter(r=>(r.status||"Menunggu")==="Menunggu").length,tdn=mine().filter(r=>r.tgl===td).length;
const KP=[["📋","Total laporan",d.length,dseries(d,7),"#2a6fb0"],["🧑‍⚕️","Pasien dilayani",sum(d,"pasien"),dseries(d,7,"pasien"),"#0b7a5f"],["👥","Petugas bertugas",sum(d,"jmlPetugas"),dseries(d,7,"jmlPetugas"),"#7c5cff"],["🚑","Dirujuk",sum(d,"rujukan"),dseries(d,7,"rujukan"),"#d98a00"],["✅","Terverifikasi",d.filter(r=>r.status==="Terverifikasi").length,dseries(d.filter(r=>r.status==="Terverifikasi"),7),"#12a58a"]];
const ks=[["Ringan",sum(d,"ringan"),"#34d3a8"],["Sedang",sum(d,"sedang"),"#f0b44a"],["Berat",sum(d,"berat"),"#ef6a5b"]],kt=ks.reduce((a,b)=>a+b[1],0),lb=[];for(let i=13;i>=0;i--){const t=new Date();t.setDate(t.getDate()-i);const s=ymd(t);lb.push(s.slice(8,10)+"/"+s.slice(5,7))}
let rk="",tl="";if(P){const R=KAB.map(k=>{const f=d.filter(r=>r.kab===k);return[k,sum(f,"pasien"),f.length]}).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,R[0][1]);rk=R.map((r,i)=>`<div class="rk"><span>${["🥇","🥈","🥉"][i]||i+1}</span><b>${r[0]}</b><div class="rb"><i style="width:${r[1]/mx*100}%"></i></div><span>${r[1]}</span></div>`).join("");tl=R.map(r=>{const a=.15+.85*r[1]/mx;return`<div class="tl" style="--a:${a};color:${a>.5?"#fff":"inherit"}"><b>${r[0]}</b>${r[1]} pasien<br><em>${r[2]} laporan</em></div>`}).join("")}
const rc=d.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,6).map(r=>`<div class="ti2"><i></i><div><b>${esc(r.kab)}</b> · ${esc(r.lokasi)} — ${r.pasien} pasien <span class="b ${(r.status||"M")[0]}">${r.status||"Menunggu"}</span><small>${esc(r.tgl)} · ${esc(r.petugas)}</small></div></div>`).join("")||`<p class="mu">Belum ada laporan.</p>`;
return`<div class="hb"><p>${new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p><h2>${g}, ${esc(S.user)} 👋</h2><p>${P?tdn+" laporan masuk hari ini dari "+KAB.length+" kabupaten/kota":"Anda mengirim "+tdn+" laporan hari ini"}</p>${wait?`<span class="wt">⏳ ${wait} laporan menunggu verifikasi</span>`:""}<div class="ha"><button onclick="nav('${P?"daftar":"input"}')">${P?"Lihat laporan masuk":"+ Input laporan"}</button><button class="g" onclick="nav('unduh')">Unduh data</button></div><svg class="ecg2" viewBox="0 0 300 50" preserveAspectRatio="none"><path d="M0 25h80l8-18 10 38 10-30 6 10h186"/></svg></div>
<div class="card" style="margin-bottom:14px"><h2>🔎 Filter dashboard</h2>${fbar()}</div><div class="ks">${KP.map((k,i)=>`<div class="k kc" style="--c:${k[4]};--d:${i*.07}s"><div class="ki">${k[0]}</div><div><b>${k[2]}</b><span>${k[1]}</span></div>${sp(k[3],k[4])}<em>+${k[3].reduce((a,b)=>a+b,0)} dalam 7 hari</em></div>`).join("")}</div>
<div class="dg"><div class="card s8"><h2>📈 Tren pasien 14 hari</h2>${area(dseries(d,14,"pasien"),lb)}</div><div class="card s4"><h2>🩺 Keparahan kasus</h2>${donut(ks,kt)}<div class="lgd">${ks.map(a=>`<span><i style="background:${a[2]}"></i>${a[0]} ${a[1]}</span>`).join("")}</div></div>
${P?`<div class="card s7"><h2>🏆 Peringkat pasien per kabupaten/kota</h2>${rk}</div><div class="card s5"><h2>🗺️ Peta panas aktivitas</h2><div class="tls">${tl}</div></div>`:`<div class="card s7"><h2>👩‍⚕️ Jenis tenaga kesehatan</h2>${bars(TENAGA.map(t=>[t,d.filter(r=>r.tenaga===t).length]))}</div><div class="card s5"><h2>✅ Status verifikasi</h2>${bars([["Menunggu",wait],["Terverifikasi",d.filter(r=>r.status==="Terverifikasi").length],["Perlu Revisi",d.filter(r=>r.status==="Perlu Revisi").length]],"var(--bl)")}</div>`}
<div class="card s12"><h2>🕔 Aktivitas terbaru</h2><div class="tm">${rc}</div></div></div>`}
function prs(n){const e=ymd(new Date());let a="";if(n==="bln")a=e.slice(0,8)+"01";else if(n!=="all"){const s=new Date();s.setDate(s.getDate()-(n-1));a=ymd(s)}S.f.dari=a;S.f.sampai=n==="all"?"":e;S.f.pr=n;render(true)}
function fbar(){const f=S.f,P=S.user===PROV,n=filt().length,pr=[["all","Semua"],["1","Hari ini"],["7","7 hari"],["30","30 hari"],["90","90 hari"],["bln","Bulan ini"]],op=(a,v)=>a.map(x=>`<option ${v===x?"selected":""}>${x}</option>`).join("");
return`<div class="chips">${pr.map(p=>`<button class="ch ${(f.pr||"all")===p[0]?"on":""}" onclick="prs('${p[0]}')">${p[1]}</button>`).join("")}<span class="cnt">${n} data</span></div><div class="row fr"><div><label>Cari</label><input value="${esc(f.q||"")}" placeholder="petugas, lokasi..." onchange="S.f.q=this.value;render(true)"></div>${P?`<div><label>Kab/Kota</label><select onchange="S.f.kab=this.value;render(true)"><option value="">Semua</option>${KAB.map(k=>`<option ${f.kab===k?"selected":""}>${k}</option>`).join("")}</select></div>`:""}<div><label>Jenis tenaga</label><select onchange="S.f.ten=this.value;render(true)"><option value="">Semua</option>${op(TENAGA,f.ten)}</select></div><div><label>Status</label><select onchange="S.f.st=this.value;render(true)"><option value="">Semua</option>${op(["Menunggu","Terverifikasi","Perlu Revisi"],f.st)}</select></div><div><label>Dari</label><input type="date" value="${f.dari||""}" onchange="S.f.dari=this.value;S.f.pr='x';render(true)"></div><div><label>Sampai</label><input type="date" value="${f.sampai||""}" onchange="S.f.sampai=this.value;S.f.pr='x';render(true)"></div><div><label>Urutkan</label><select onchange="S.f.so=this.value;render(true)"><option value="">Terbaru</option><option value="old" ${f.so==="old"?"selected":""}>Terlama</option><option value="pas" ${f.so==="pas"?"selected":""}>Pasien terbanyak</option></select></div><div style="flex:0"><label>&nbsp;</label><button class="g" onclick="S.f={};render(true)">Reset</button></div></div>`}
function vLog(){const L=S.LOG||[],f=S.lf||(S.lf={}),ws=[...new Set(L.map(l=>l.wil))].sort(),as=[...new Set(L.map(l=>l.aksi))].sort(),dt=l=>ymd(new Date(l.ts)),op=(a,v)=>a.map(x=>`<option ${v===x?"selected":""}>${esc(x)}</option>`).join("");let d=L.slice().sort((a,b)=>b.ts-a.ts);if(f.w)d=d.filter(l=>l.wil===f.w);if(f.a)d=d.filter(l=>l.aksi===f.a);if(f.q)d=d.filter(l=>(l.wil+" "+l.aksi).toLowerCase().includes(f.q.toLowerCase()));if(f.dari)d=d.filter(l=>dt(l)>=f.dari);if(f.sampai)d=d.filter(l=>dt(l)<=f.sampai);const n=d.length;d=d.slice(0,200);
return`<div class="card"><h2>Log Aktivitas</h2><div class="row fr"><div><label>Cari</label><input value="${esc(f.q||"")}" onchange="S.lf.q=this.value;render(true)"></div><div><label>Wilayah</label><select onchange="S.lf.w=this.value;render(true)"><option value="">Semua</option>${op(ws,f.w)}</select></div><div><label>Aksi</label><select onchange="S.lf.a=this.value;render(true)"><option value="">Semua</option>${op(as,f.a)}</select></div><div><label>Dari</label><input type="date" value="${f.dari||""}" onchange="S.lf.dari=this.value;render(true)"></div><div><label>Sampai</label><input type="date" value="${f.sampai||""}" onchange="S.lf.sampai=this.value;render(true)"></div><div style="flex:0"><label>&nbsp;</label><button class="g" onclick="S.lf={};render(true)">Reset</button></div></div><p class="mu">${n} aktivitas (tampil maks. 200)</p><div class="tw"><table><tr><th>Waktu</th><th>Wilayah</th><th>Aksi</th></tr>${d.map(l=>`<tr><td>${new Date(l.ts).toLocaleString("id-ID")}</td><td>${esc(l.wil)}</td><td>${esc(l.aksi)}</td></tr>`).join("")||`<tr><td colspan="3" class="mu">Kosong.</td></tr>`}</table></div></div>`}
</script></body></html>
